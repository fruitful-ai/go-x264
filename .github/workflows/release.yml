name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx264-dev gcc

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -v ./...

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
