name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc curl bzip2

      - name: Build
        run: make

      - name: Test
        run: make test

      - name: Create platform tarball
        run: tar czf x264-linux-amd64.tar.gz -C internal/x264 .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: x264-linux-amd64.tar.gz
          generate_release_notes: true
